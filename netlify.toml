[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_NAME,ADMIN_EMAIL,CAFE_DIGITAL_NAME,CAFE_DIGITAL_EMAIL,TUTOR_MONSERRAT_EMAIL,TUTOR_VIVIANA_EMAIL,TUTOR_FERNANDO_EMAIL,TUTOR_DENISSE_BRAVO_EMAIL,TUTOR_DENISSE_ROSSEL_EMAIL"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/reset-state"
  to = "/.netlify/functions/reset-state"
  status = 200

[[redirects]]
  from = "/api/change-password"
  to = "/.netlify/functions/change-password"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/reset-users"
  to = "/.netlify/functions/reset-users"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
